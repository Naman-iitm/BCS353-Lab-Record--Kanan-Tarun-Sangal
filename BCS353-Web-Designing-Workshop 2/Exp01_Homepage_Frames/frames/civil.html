<!DOCTYPE html>
<!-- RIGHT FRAME - CIVIL department catalogue (opens when "CIVIL" is clicked) -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CIVIL Books</title>
    <link rel="stylesheet" href="../css/style.css">
    <script>
        function addToCart(bookName) {
            alert('"' + bookName + '" has been added to your cart.');
        }
    </script>
</head>
<body>
    <div class="content">
        <h2>CIVIL - Civil Engineering Books</h2>
        <table class="grid">
            <tr><th>Cover</th><th>Book</th><th>Author</th><th>Publisher</th><th>Price</th><th>Action</th></tr>
            <tr>
                <td><img class="cover" src="../images/structural.svg" alt="Structural Analysis"></td>
                <td>Structural Analysis</td><td>R. C. Hibbeler</td><td>Tata McGraw Hill</td>
                <td class="price">$58</td>
                <td><button class="btn orange" onclick="addToCart('Structural Analysis')">Add to cart</button></td>
            </tr>
            <tr>
                <td><img class="cover" src="../images/geotechnical.svg" alt="Geotechnical Engineering"></td>
                <td>Geotechnical Engineering</td><td>B. M. Das</td><td>Elsevier</td>
                <td class="price">$42</td>
                <td><button class="btn orange" onclick="addToCart('Geotechnical Engineering')">Add to cart</button></td>
            </tr>
        </table>
    </div>
</body>
</html>
