<!DOCTYPE html>
<!-- RIGHT FRAME - EEE department catalogue (opens when "EEE" is clicked) -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EEE Books</title>
    <link rel="stylesheet" href="../css/style.css">
    <script>
        function addToCart(bookName) {
            alert('"' + bookName + '" has been added to your cart.');
        }
    </script>
</head>
<body>
    <div class="content">
        <h2>EEE - Electrical &amp; Electronics Engineering Books</h2>
        <table class="grid">
            <tr><th>Cover</th><th>Book</th><th>Author</th><th>Publisher</th><th>Price</th><th>Action</th></tr>
            <tr>
                <td><img class="cover" src="../images/electric-machines.svg" alt="Electric Machines"></td>
                <td>Electric Machines</td><td>I. J. Nagrath</td><td>Pearson</td>
                <td class="price">$48</td>
                <td><button class="btn orange" onclick="addToCart('Electric Machines')">Add to cart</button></td>
            </tr>
            <tr>
                <td><img class="cover" src="../images/power-systems.svg" alt="Power Systems"></td>
                <td>Power Systems</td><td>C. L. Wadhwa</td><td>Cambridge</td>
                <td class="price">$52</td>
                <td><button class="btn orange" onclick="addToCart('Power Systems')">Add to cart</button></td>
            </tr>
        </table>
    </div>
</body>
</html>
