<!DOCTYPE html>
<!-- RIGHT FRAME - CART PAGE (Experiment 4 inside the framed site)
     Shows books added to the cart with price, quantity, amount and total. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart Page</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="content">
        <h2>My Cart</h2>
        <table class="grid">
            <tr>
                <th>Book Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Amount</th>
            </tr>
            <tr>
                <td>Java 2</td>
                <td>$35.5</td>
                <td>2</td>
                <td>$70</td>
            </tr>
            <tr>
                <td>XML Bible</td>
                <td>$40.5</td>
                <td>1</td>
                <td>$40.5</td>
            </tr>
            <tr class="total-row">
                <td colspan="3">Total amount</td>
                <td>- $130.5</td>
            </tr>
        </table>
        <p class="note">The cart page contains the details of the books which have been
        added to the cart. Clicking &ldquo;Add to cart&rdquo; on the Catalogue page adds
        a book to this list.</p>
    </div>
</body>
</html>
