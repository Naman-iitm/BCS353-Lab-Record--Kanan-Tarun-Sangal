<!DOCTYPE html>
<!-- RIGHT FRAME - LOGIN PAGE (Experiment 2 inside the framed site) -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link rel="stylesheet" href="../css/style.css">
    <script>
        // Basic login feedback (full JS validation is demonstrated in Exp 6 & 7)
        function checkLogin() {
            var u = document.loginForm.username.value.trim();
            var p = document.loginForm.password.value.trim();
            if (u === "" || p === "") {
                alert("Please enter both User Name and Password.");
                return false;
            }
            alert("Welcome " + u + "! Login successful (demo).");
            return false; // static site: stay on the same page
        }
    </script>
</head>
<body>
    <div class="content">
        <h2>Login Page</h2>
        <form name="loginForm" class="card" onsubmit="return checkLogin()">
            <div class="row">
                <label for="username">User Name:</label>
                <input type="text" id="username" name="username" placeholder="Enter your user name">
            </div>
            <div class="row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
            </div>
            <div class="btn-row">
                <button type="submit" class="btn orange">Submit</button>
                <button type="reset" class="btn gray">Reset</button>
            </div>
        </form>
    </div>
</body>
</html>
