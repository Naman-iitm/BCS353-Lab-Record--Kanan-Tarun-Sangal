<!DOCTYPE html>
<!--
  EXPERIMENT 5 - REGISTRATION FORM (standalone, HTML only)
  Fields:
   1) Name (text)        2) Password (password)   3) E-mail id (text)
   4) Phone Number       5) Sex (radio buttons)   6) Date of birth (3 select boxes)
   7) Languages known (checkboxes)                8) Address (textarea)
  JavaScript validation for these fields is added in Experiments 6 & 7.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exp 5 - Registration Form</title>
    <link rel="icon" type="image/svg+xml" href="../Exp01_Homepage_Frames/images/logo.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Segoe UI", Arial, sans-serif; background: #f5f7fa; color: #2d3748; }

        header { background: linear-gradient(135deg, #1f3a5f, #2c5282); color: #fff; }
        .brand { display: flex; align-items: center; gap: 14px; padding: 12px 24px; }
        .brand img { width: 52px; height: 52px; }
        .brand h1 { font-size: 1.3rem; }
        .brand small { display: block; font-size: .72rem; font-weight: 400; opacity: .85; }
        nav { display: flex; background: rgba(0,0,0,.22); }
        nav a { flex: 1; text-align: center; color: #fff; text-decoration: none; padding: 10px;
                border-right: 1px solid rgba(255,255,255,.15); font-size: .9rem; }
        nav a:last-child { border-right: none; }
        nav a:hover, nav a.active { background: #f4a261; color: #1f3a5f; }

        .layout { display: flex; min-height: calc(100vh - 118px); }
        aside { width: 190px; background: #1f3a5f; color: #fff; padding: 18px 0; }
        aside h3 { text-align: center; font-size: .9rem; text-transform: uppercase;
                   letter-spacing: 1px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.2);
                   margin: 0 12px 12px; }
        aside a { display: block; color: #dbeafe; text-decoration: none; padding: 12px 22px;
                  border-left: 4px solid transparent; }
        aside a:hover { background: rgba(244,162,97,.18); border-left-color: #f4a261; color: #fff; }

        main { flex: 1; padding: 30px 36px; }
        main h2 { color: #1f3a5f; border-bottom: 3px solid #f4a261; display: inline-block;
                  padding-bottom: 4px; margin-bottom: 18px; }

        form.card { background: #fff; max-width: 620px; margin: auto; padding: 28px 32px;
                    border-radius: 10px; box-shadow: 0 3px 12px rgba(0,0,0,.1); }
        .row { margin-bottom: 17px; }
        label.lbl { display: block; font-weight: 600; margin-bottom: 6px; color: #1f3a5f; }
        input[type="text"], input[type="password"], input[type="email"],
        input[type="tel"], select, textarea {
            width: 100%; padding: 9px 11px; border: 1px solid #cbd5e0; border-radius: 6px;
            font-size: .95rem; font-family: inherit; }
        textarea { min-height: 80px; resize: vertical; }
        .inline-opts { display: flex; gap: 18px; flex-wrap: wrap; }
        .inline-opts label { font-weight: 400; display: inline-flex; gap: 6px; align-items: center; }
        .dob select { width: auto; min-width: 90px; margin-right: 10px; }
        .btn-row { display: flex; gap: 14px; justify-content: center; margin-top: 10px; }
        button { border: none; padding: 10px 30px; border-radius: 6px; font-size: .95rem;
                 cursor: pointer; color: #fff; }
        .submit { background: #dd6b20; } .submit:hover { background: #c05621; }
        .reset  { background: #718096; } .reset:hover  { background: #4a5568; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <img src="../Exp01_Homepage_Frames/images/logo.svg" alt="BookHaven logo">
            <h1>BookHaven Online Bookstore
                <small>GL Bajaj Institute of Technology &amp; Management &bull; Project by: Kanan Tarun Sangal</small>
            </h1>
        </div>
        <nav>
            <a href="../Exp01_Homepage_Frames/frames/home.html">Home</a>
            <a href="../Exp02_Login_Page/index.html">Login</a>
            <a href="#" class="active">Registration</a>
            <a href="../Exp03_Catalogue_Page/index.html">Catalogue</a>
            <a href="../Exp04_Cart_Page/index.html">Cart</a>
        </nav>
    </header>

    <div class="layout">
        <aside>
            <h3>Departments</h3>
            <a href="../Exp01_Homepage_Frames/frames/cse.html">CSE</a>
            <a href="../Exp01_Homepage_Frames/frames/ece.html">ECE</a>
            <a href="../Exp01_Homepage_Frames/frames/eee.html">EEE</a>
            <a href="../Exp01_Homepage_Frames/frames/civil.html">CIVIL</a>
        </aside>

        <main>
            <h2>Registration Form</h2>
            <form class="card" action="#" method="post">

                <div class="row">
                    <label class="lbl" for="name">1) Name:</label>
                    <input type="text" id="name" name="name" placeholder="Full name (min. 6 characters)">
                </div>

                <div class="row">
                    <label class="lbl" for="pwd">2) Password:</label>
                    <input type="password" id="pwd" name="password" placeholder="Min. 6 characters">
                </div>

                <div class="row">
                    <label class="lbl" for="email">3) E-mail id:</label>
                    <input type="email" id="email" name="email" placeholder="name@domain.com">
                </div>

                <div class="row">
                    <label class="lbl" for="phone">4) Phone Number:</label>
                    <input type="tel" id="phone" name="phone" maxlength="10" placeholder="10-digit mobile number">
                </div>

                <div class="row">
                    <label class="lbl">5) Sex:</label>
                    <div class="inline-opts">
                        <label><input type="radio" name="sex" value="male"> Male</label>
                        <label><input type="radio" name="sex" value="female"> Female</label>
                        <label><input type="radio" name="sex" value="other"> Other</label>
                    </div>
                </div>

                <div class="row dob">
                    <label class="lbl">6) Date of Birth:</label>
                    <select name="dob-day">
                        <option value="">Day</option>
                        <option>1</option><option>2</option><option>3</option><option>4</option>
                        <option>5</option><option>6</option><option>7</option><option>8</option>
                        <option>9</option><option>10</option><option>11</option><option>12</option>
                        <option>13</option><option>14</option><option>15</option><option>16</option>
                        <option>17</option><option>18</option><option>19</option><option>20</option>
                        <option>21</option><option>22</option><option>23</option><option>24</option>
                        <option>25</option><option>26</option><option>27</option><option>28</option>
                        <option>29</option><option>30</option><option>31</option>
                    </select>
                    <select name="dob-month">
                        <option value="">Month</option>
                        <option value="1">Jan</option><option value="2">Feb</option>
                        <option value="3">Mar</option><option value="4">Apr</option>
                        <option value="5">May</option><option value="6">Jun</option>
                        <option value="7">Jul</option><option value="8">Aug</option>
                        <option value="9">Sep</option><option value="10">Oct</option>
                        <option value="11">Nov</option><option value="12">Dec</option>
                    </select>
                    <select name="dob-year">
                        <option value="">Year</option>
                        <option>2008</option><option>2007</option><option>2006</option>
                        <option>2005</option><option>2004</option><option>2003</option>
                        <option>2002</option><option>2001</option><option>2000</option>
                        <option>1999</option><option>1998</option><option>1997</option>
                        <option>1996</option><option>1995</option>
                    </select>
                </div>

                <div class="row">
                    <label class="lbl">7) Languages known:</label>
                    <div class="inline-opts">
                        <label><input type="checkbox" name="lang" value="English"> English</label>
                        <label><input type="checkbox" name="lang" value="Telugu"> Telugu</label>
                        <label><input type="checkbox" name="lang" value="Hindi"> Hindi</label>
                        <label><input type="checkbox" name="lang" value="Tamil"> Tamil</label>
                    </div>
                </div>

                <div class="row">
                    <label class="lbl" for="addr">8) Address:</label>
                    <textarea id="addr" name="address" placeholder="Enter your full address"></textarea>
                </div>

                <div class="btn-row">
                    <button type="submit" class="submit">Register</button>
                    <button type="reset" class="reset">Reset</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
